[package]
name = "fractal-pie"
version = "0.1.0"
edition = "2021"
description = "Fractal image compression by quadtree plane fitting"
readme = "README.md"

[dependencies]
heic-rs = "0.1.1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "tiff",
    "bmp",
    "gif",
    "webp",
] }
oxideav-jpeg2000 = { version = "0.0.16", default-features = false }
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
